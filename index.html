<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>:re</title>
<link rel="icon" href="icon.png">
  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}
.star{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
pointer-events:none;
animation: sparkle 0.5s linear;
}

@keyframes sparkle{
0%{
transform:scale(1);
opacity:1;
}

100%{
transform:scale(0);
opacity:0;
}
}
/* FONDO */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("fondo.gif");
background-size:cover;
background-position:center;
color:white;
overflow:hidden;
cursor:url("cursor.png"), auto;
}

a:hover{
cursor:url("cursor2.png"), pointer;
}
/* TARJETA */

.card{
backdrop-filter:blur(20px);
background:rgba(0,0,0,0.4);
padding:40px;
border-radius:20px;
text-align:center;
width:320px;
box-shadow:0 0 40px rgba(0,0,0,0.8);
animation:fade 1.5s;
}

/* ANIMACIÓN */

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* FOTO */

.profile{
width:95px;
height:95px;
border-radius:50%;
border:3px solid white;
margin-bottom:10px;
}

/* TEXTO */

h2{
margin-top:10px;
}

.bio{
opacity:0.8;
margin-bottom:20px;
}

/* ICONOS */

.links{
display:flex;
justify-content:center;
gap:15px;
}

.links a{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
border-radius:12px;
color:white;
font-size:22px;
transition:0.2s;
text-decoration:none;
}

.links a:hover{
transform:scale(1.15);
background:#444;
}

</style>

</head>

<body>

<!-- MUSICA -->

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">

<img src="avatar.png" class="profile">

<h2>6ixvcr</h2>

<p class="bio">welcome ^_^</p>

<div class="links">

<a href="https://x.com/6ixvcr"><i class="fa-brands fa-x-twitter"></i></a>

<a href="https://www.youtube.com/@Drxsso"><i class="fa-brands fa-youtube"></i></a>

<a href="https://open.spotify.com/user/31q5ju3ox4di7xmrs6jnwiuylpca?si=a802434fe0de422f"><i class="fa-brands fa-spotify"></i></a>

</div>

</div>
<script>

document.addEventListener("mousemove", function(e){

let star = document.createElement("div");

star.style.left = e.pageX + "px";
star.style.top = e.pageY + "px";

star.classList.add("star");

document.body.appendChild(star);

setTimeout(function(){
star.remove();
},500);

});

</script>
</body>

</html>
